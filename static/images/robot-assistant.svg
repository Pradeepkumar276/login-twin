<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Bot Head -->
  <rect x="25" y="30" width="50" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <!-- Antennas -->
  <line x1="50" y1="30" x2="50" y2="18" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="50" cy="15" r="4" fill="#6366f1"/>
  <!-- Visor / Eyes -->
  <rect x="33" y="42" width="34" height="14" rx="5" fill="#0369a1"/>
  <circle cx="42" cy="49" r="3" fill="#38bdf8"/>
  <circle cx="58" cy="49" r="3" fill="#38bdf8"/>
  <!-- Mouth / Speaker -->
  <line x1="40" y1="62" x2="60" y2="62" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <!-- Ear cups -->
  <rect x="18" y="44" width="7" height="14" rx="2" fill="#38bdf8"/>
  <rect x="75" y="44" width="7" height="14" rx="2" fill="#38bdf8"/>
</svg>
