<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <!-- Outer radar circles -->
  <circle cx="80" cy="80" r="70" stroke="#1e293b" stroke-width="2"/>
  <circle cx="80" cy="80" r="50" stroke="#1e293b" stroke-width="2"/>
  <circle cx="80" cy="80" r="30" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="80" cy="80" r="6" fill="#38bdf8"/>

  <!-- Crosshairs -->
  <line x1="80" y1="10" x2="80" y2="150" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="10" y1="80" x2="150" y2="80" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Radar sweep wedge -->
  <path d="M80 80 L140 45 A70 70 0 0 0 80 10 Z" fill="url(#sweepGrad)" opacity="0.35"/>
  <defs>
    <linearGradient id="sweepGrad" x1="80" y1="80" x2="140" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
</svg>
