<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Correlation graph nodes -->
  <line x1="60" y1="25" x2="30" y2="75" stroke="#a855f7" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="60" y1="25" x2="90" y2="75" stroke="#a855f7" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="30" y1="75" x2="90" y2="75" stroke="#38bdf8" stroke-width="2"/>
  <line x1="60" y1="25" x2="60" y2="100" stroke="#f59e0b" stroke-width="2"/>

  <!-- Center Pivot node -->
  <circle cx="60" cy="25" r="14" fill="#0f172a" stroke="#a855f7" stroke-width="3"/>
  <text x="60" y="28" fill="#c084fc" font-size="9" font-family="monospace" font-weight="bold" text-anchor="middle">IP</text>

  <!-- Leaf nodes -->
  <circle cx="30" cy="75" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="30" y="78" fill="#38bdf8" font-size="8" font-family="monospace" text-anchor="middle">DET1</text>

  <circle cx="90" cy="75" r="12" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
  <text x="90" y="78" fill="#f87171" font-size="8" font-family="monospace" text-anchor="middle">DET2</text>

  <circle cx="60" cy="100" r="10" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="60" y="103" fill="#34d399" font-size="7" font-family="monospace" text-anchor="middle">INC</text>
</svg>
