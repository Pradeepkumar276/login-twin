<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" fill="none">
  <!-- Step 1: Ingest -->
  <rect x="10" y="25" width="100" height="70" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="2"/>
  <text x="60" y="55" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">INGESTION</text>
  <text x="60" y="73" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">JSON / Log Stream</text>
  <path d="M115 60 L130 60" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="135,60 127,55 127,65" fill="#38bdf8"/>

  <!-- Step 2: Normalize -->
  <rect x="140" y="25" width="100" height="70" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
  <text x="190" y="55" fill="#818cf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">NORMALIZER</text>
  <text x="190" y="73" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">UTC ISO-8601</text>
  <path d="M245 60 L260 60" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="265,60 257,55 257,65" fill="#818cf8"/>

  <!-- Step 3: Detection Rules -->
  <rect x="270" y="25" width="100" height="70" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="320" y="55" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">DETECTION</text>
  <text x="320" y="73" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">DET-001..005</text>
  <path d="M375 60 L390 60" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <polygon points="395,60 387,55 387,65" fill="#fbbf24"/>

  <!-- Step 4: Correlation -->
  <rect x="400" y="25" width="90" height="70" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
  <text x="445" y="55" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CORRELATION</text>
  <text x="445" y="73" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Pivot Keys & Time</text>
  <path d="M495 60 L510 60" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
  <polygon points="515,60 507,55 507,65" fill="#c084fc"/>

  <!-- Step 5: Incident & Audit -->
  <rect x="520" y="25" width="70" height="70" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="555" y="55" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">INCIDENT</text>
  <text x="555" y="73" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Hash Chain</text>
</svg>
